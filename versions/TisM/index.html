<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tokenmobiles</title>

<style>

body{
    background:#000000;
    color:white;
    font-family:Arial, sans-serif;
    padding:60px;
}

.rack{
    width:100%;
    max-width:100%;
    box-sizing:border-box;
    border:2px solid #FFFFFF;
    padding:20px;
}

.rack-id{
    font-size:33px;
    margin-bottom:120px;
    font-weight:300;

    word-break:break-word;
    overflow-wrap:anywhere;
}

.timer-section{
    margin-bottom:120px;
}

.timer{
    font-size:58px;
    font-weight:300;
    line-height:1;
}

.end-time{
    margin-top:10px;
    font-size:32px;
    opacity:0.55;
    font-weight:300;
}

.bottom-row{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    width:100%;
    gap:10px;
}

.left-meta{
    display:flex;
    gap:60px;
}

.meta-item{
    font-size:30px;
    font-weight:300;
}

.value{
    font-size:46px;
    font-weight:300;
}

.frozen{
    color:red;
    margin-top:40px;
    font-size:24px;
}

@media (max-width: 768px){

body{
    padding:20px
}

.rack-id{
    font-size:16px;
    margin-bottom:60px;
}

.timer{
    font-size:34px;
}

.end-time{
    font-size:14px;
}

.meta-item{
    font-size:18px;
}

.value{
    font-size:28px;
}

.timer-section{
    margin-bottom:60px;
}

.left-meta{
    gap:20px;
}
}

</style>
</head>

async function fetchRack(rackName){

    const res = await fetch(
        `/rack/${rackName}`
    );

    return await res.json();
}

function createRackHTML(data){

    return `

        <div class="rack">

            <div class="rack-id"
                 style="color:${data.rack_color};">
                ${data.rack_id}
            </div>

            <div class="timer-section">

                <div class="timer">
                    ${data.timer}
                </div>

                <div class="end-time">
                    ${data.cycle_end_display}
                </div>

            </div>

            <div class="bottom-row">

                <div class="left-meta">

                    <div class="meta-item">
                        -${data.remaining_cycles}×
                    </div>

                    <div class="meta-item">
                        +${data.boost_percent}%
                    </div>

                    <div class="meta-item">
                        ${data.supply_current}/${data.supply_total}
                    </div>

                </div>

                <div class="value">
                    ${data.value}
                </div>

            </div>

            <div class="frozen"
                style="
                    display:${data.frozen ? 'block' : 'none'};
                "
            >
                MAX VALUE
            </div>

        </div>

    `;
}

async function update(){

    const container =
        document.getElementById(
            "rack-container"
        );

    const res =
        await fetch("/racks");

    const allData =
        await res.json();

    container.innerHTML =
        allData
            .map(createRackHTML)
            .join("");
}

setInterval(update,1000);

update();
